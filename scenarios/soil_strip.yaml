# 지역마다 다른 흙: 보통 흙(firm) 위를 걷다가 x 2.0~3.5 m의 진흙 띠를 건너 다시 보통 흙으로 (foot_soil.regions)
#   python -m sim.runner scenarios/soil_strip.yaml --rviz
#   python -m sim.rt_link scenarios/soil_strip.yaml --rviz          # C++ 코어 (실시간)
# 진흙 띠 폭과 흙은 --set으로 바꾼다: --set 'foot_soil.regions=[{region: [2,-10,3,10], preset: soft}]'
name: soil_strip
duration: 16.0
seed: 0
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.2, 0.4]
  patches: []
controller:
  type: trot
  period: 0.36
  swing_height: 0.07
  stand_height: 0.27
  perception: null
foot_soil:
  preset: firm
  plow_ratio: 1.0
  regions:
    - {name: mud_strip, region: [2.0, -10.0, 3.5, 10.0], preset: mud}
events:
  - {t: 1.0, action: set_command, vx: 0.4, yaw_rate: 0.0}
