# 차 두 대가 낸 자국을 로봇이 넘는다 (맵 서버 4단계). 시뮬레이터에는 Chrono가 없고, 차는 별도 프로세스 둘이다:
#   python conformance/probe_two_chrono.py --robot scenarios/two_cars_crossing.yaml   (mj_ros)
# 차는 x = 3 m를 y 방향으로 지나가며 자국(x 약 2.2, 3.8 m)을 맵 서버에 쓰고, 로봇은 그 높이만 받는다. 차와 로봇 사이에 물리 작용은 없다.
# 시뮬레이터 혼자 돌리면 (맵 서버 없이) 자국이 없는 평평한 땅이다. scenario_replay.yaml로 다시 돌리면 차 없이 같은 자국이 들어온다.
name: two_cars_crossing
duration: 42.0
seed: 2
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches:
    # 차가 지나는 영역(x 1~5 m)은 평평해야 하므로 요철은 그 뒤에만 둔다
    - {kind: rough, amplitude: 0.012, region: [5.0, -3.0, 9.0, 3.0]}
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception:
    sensor: front_lidar
events:
  - {t: 25.0, action: set_command, vx: 0.35, yaw_rate: 0.0}   # 차 두 대가 다 지나간 뒤 출발 (뒤 차 프로세스는 실시간의 약 0.5배)
