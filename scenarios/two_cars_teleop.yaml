# 사람이 로봇을 /cmd_vel로 몰고, 로봇이 길 앞 지점에 닿으면 차 두 대가 지나간다 (two_cars_cross와 같은 지형, 차 길, 드론, 차 감시):
#   터미널 1: python -m sim.runner scenarios/two_cars_teleop.yaml --cmd-vel --godot     (mj_ros. --cmd-vel이 --ros2, --realtime을 켠다)
#   터미널 2: ros2 run teleop_twist_keyboard teleop_twist_keyboard                       (같은 ROS_DOMAIN_ID. i 앞, , 뒤, j/l 돌기, k 멈춤)
# 차 두 대는 로봇 몸통이 x 4 ~ 7 m, y -3 ~ 3 m (car_a 길 x 9 m에서 2 ~ 5 m 앞)에 들어오면 출발한다 (vehicles.cars[].start_when).
# car_a는 y -20 m, car_b는 y -32 m에서 출발해 로봇 앞을 지나간다. 로봇의 차 감시는 그동안 운용자 명령과 상관없이 로봇을 세운다.
# 시나리오는 20분 (창을 닫거나 Ctrl+C로 끝낸다). 받은 /cmd_vel은 이벤트로 기록되어 실행 폴더의 scenario_replay.yaml로 다시 돌릴 수 있다 (차는 실시간이라 같지 않다).
name: two_cars_teleop
duration: 1200.0
seed: 2
terrain:
  size: [20.0, 38.0]          # 반폭 (m): x ±20, y ±38. 차 길과 차 SCM (car_a x 3 ~ 15, y -26 ~ 32. car_b x 3.0 ~ 19.2, y -35.5 ~ 23.5)을 다 덮는다
  window: [4.0, 4.0]          # 로봇 물리 (MuJoCo)에는 로봇 둘레 창만 올린다
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches:
    # 요철은 차 SCM 영역 (지도 높이가 정확히 0이어야 한다) 밖, 로봇이 처음 걷는 곳에 둔다
    - {kind: rough, amplitude: 0.015, region: [0.4, -2.0, 2.2, 2.0]}
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception:
    sensor: front_lidar
    vehicle_guard: {ahead: 8.5, side: 15.0, clear_s: 2.0}   # 차 감시 (높이 0.15 m, 점 10개는 control/vehicle_guard.py 기본값). 2초 안 보이면 다시 걷는다
drone:                         # 촬영 드론 (sim/drone.py, 경로 계산형, 물리 없음): 로봇 뒤 2.5 m, 위 2 m를 따라가며 로봇을 본다. Godot에서 V로 드론 시점
  offset: [-2.5, 0.0, 2.0]
  max_speed: 3.0
  max_accel: 2.0
events: []                     # 로봇 명령은 /cmd_vel로 (--cmd-vel)
vehicles:
  soil: {bekker_kphi: 1.0e7}       # 다른 차 시나리오 (5.0e6)보다 2배 단단한 흙: 자국 약 3 cm (5.0e6은 5 ~ 6 cm라 로봇이 가끔 넘어졌다)
  hz: 100
  delay: 0.2
  yield_to_robot: true            # 안전장치: 사람이 로봇을 차 길 가까이 (앞 9 m, 옆 ±1.8 m) 몰면 차가 서서 기다린다
  cars:
    # 출발과 끝은 로봇의 좌우 ±15 m 감시 범위 밖 (서 있는 차가 보이면 로봇이 계속 기다린다)
    - {name: car_a, start: [9.0, -20.0], end: [9.0, 26.0], speed: 3.0, start_when: {robot_in: [4.0, -3.0, 7.0, 3.0]}}
    # 10° 기울어진 길 (x = 9 + (y + 18) tan 10°): y = 0에서 car_a보다 3.2 m 오른쪽 (트랙 폭 1.6 m의 두 배라 자국이 1.6 m 간격으로 고르게 놓인다)
    - {name: car_b, start: [6.531, -32.0], end: [15.700, 20.0], speed: 3.0, start_when: {robot_in: [4.0, -3.0, 7.0, 3.0]}, margin: 3.5}
