# 차가 지나가는 동안 로봇 걷기 (two_cars_map과 같은 차 두 대, 로봇만 3초에 출발). 로봇은 차가 막 낸 자국을 밟는다:
#   python -m sim.runner scenarios/two_cars_walk.yaml        (mj_ros. --godot로 화면)
# car_a는 약 4.7 ~ 5.5초, car_b는 약 8.8 ~ 10.5초에 y = 0을 지난다. 로봇 (0.35 m/s)은 약 9초에 car_a의 자국 (x 약 2.1 m, 생긴 지 약 4초)을,
# car_b가 앞을 지나간 뒤인 약 12초부터 car_b 자국을 넘는다. 0초에 출발하면 9.4초쯤 x 3.3 m에서 car_b 옆을 스친다 (로봇과 차 사이에 물리 작용은 없다).
name: two_cars_walk
duration: 24.0
seed: 2
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches:
    # 차 SCM이 덮는 영역 (car_a x -3 ~ 9 m, car_b x -3.7 ~ 10 m: 길에서 margin)은 평평해야 하므로 요철은 그 밖 (로봇 뒤)에만 둔다
    - {kind: rough, amplitude: 0.012, region: [-9.5, -4.0, -5.0, 3.0]}
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception:
    sensor: front_lidar
events:
  - {t: 3.0, action: set_command, vx: 0.35, yaw_rate: 0.0}    # 차가 지나가는 동안 출발
vehicles:
  soil: {bekker_kphi: 5.0e6}       # 단단한 흙 (무른 흙: 1.0e6)
  hz: 100
  delay: 0.2
  cars:
    - {name: car_a, start: [3.0, -14.0], end: [3.0, 26.0], speed: 3.0, t_start: 0.0}
    # 10° 기울어진 길 (x = 3 + (y + 8) tan 10°). 길이 x로 7 m 퍼져 SCM이 넓어지므로 margin을 줄여 요철 패치를 피한다
    - {name: car_b, start: [-0.174, -26.0], end: [6.879, 14.0], speed: 3.0, t_start: 0.0, margin: 3.5}
