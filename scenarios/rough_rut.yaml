# 요철 지형 + 시험 중 바퀴 자국(rut) 생성
# rut 이벤트는 Chrono SCM 변형 결과가 Terrain Map Service로 들어오는 상황을 흉내 낸다 (문서 §5.1).
name: rough_rut
duration: 15.0
seed: 1
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.2, 0.4]
  patches:
    - {kind: rough, amplitude: 0.015, region: [1.0, -3.0, 9.0, 3.0]}
    - {kind: bump, center: [2.5, 0.0], height: 0.05, radius: 0.4}
    - {kind: ramp, region: [4.0, -3.0, 5.5, 3.0], rise: 0.08}
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
events:
  - {t: 1.0, action: set_command, vx: 0.35, yaw_rate: 0.0}
  # 차량이 로봇 진행 방향을 가로질러 지나간 효과: 깊이 4 cm, 폭 30 cm 홈 두 줄
  - {t: 4.0, action: add_patch, patch: {kind: rut, start: [3.3, -4.0], end: [3.3, 4.0], width: 0.3, depth: 0.04}}
  - {t: 4.0, action: add_patch, patch: {kind: rut, start: [3.9, -4.0], end: [3.9, 4.0], width: 0.3, depth: 0.04}}
