# DIS 시나리오 콘솔로 조종하는 빈 평지 (문서 §10). 시나리오 이벤트는 없고 콘솔이 명령과 지형 변경을 넣는다.
#   python -m sim.runner scenarios/dis_console.yaml --dis-port 3000 --dis-wait --rviz
#   python -m dis_console.console --sim 127.0.0.1:3000
# 로봇은 원점에서 +x 방향을 보고 선다. 지형은 x, y 모두 ±30 m (0.35 m/s로 약 85초 직진)
name: dis_console
duration: 300.0
seed: 1
terrain:
  size: [30.0, 30.0]     # 세계 지도 반폭: x, y 모두 ±30 m (로봇을 따라다니는 창으로 MuJoCo에는 주변만 올린다)
  window: [3.0, 3.0]     # MuJoCo 창 반폭 (m)
  window_trigger: 1.0    # 로봇이 창 중심에서 이만큼 멀어지면 창 이동 (m)
  window_snap: 1.0
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches: []
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception: null     # 지형 인지: --set controller.perception.sensor=front_lidar
events: []
