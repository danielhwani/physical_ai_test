# 가로지르는 바퀴 자국 두 줄 넘기 (Chrono 없이 MuJoCo 지형만으로 빠르게)
# vehicle_crossing(HMMWV + SCM)이 남기는 자국과 같은 모양: x 2.05~2.30, 3.75~4.00 m, 폭 25 cm, 깊이 5 cm, 평평한 바닥
# 처음부터 자국이 있다. 지형 인지 보행 개발·모방학습 평가용 (최종 판정은 vehicle_crossing)
name: rut_crossing
duration: 16.0
seed: 2
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches:
    - {kind: rut, start: [2.175, -4.5], end: [2.175, 4.5], width: 0.25, depth: 0.05, profile: box}
    - {kind: rut, start: [3.875, -4.5], end: [3.875, 4.5], width: 0.25, depth: 0.05, profile: box}
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception: null     # 지형 인지 (LiDAR 높이 지도 -> 디딜 곳, 발 높이). 켜기: --set controller.perception.sensor=front_lidar
events:
  - {t: 1.0, action: set_command, vx: 0.35, yaw_rate: 0.0}
