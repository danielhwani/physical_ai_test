# 평지 직진 트롯 + 통계적 명령 지연 (lockstep에서 실시간과 비슷한 지연 패턴)
# 분포는 이 PC에서 C++ 실시간 코어 + ROS2 두뇌(--brain ros)로 잰 값: 제어 주기의 약 0.4%에서 명령이 한 주기 더 늦음
# (60초 2회 + 12초 1회, 6548주기 중 27회, +2주기 이상과 손실은 없음). shm, inproc 두뇌는 0회.
# 더 거친 링크 흉내: --set control_link.extra_steps_probs=[0.05,0.02] --set control_link.drop_probability=0.01
name: flat_trot_jitter
duration: 12.0
seed: 0
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.2, 0.4]
  patches: []
controller:
  type: trot
  period: 0.36
  swing_height: 0.07
  stand_height: 0.27
  perception: null
control_link:
  latency_steps: 1
  extra_steps_probs: [0.004]   # +1주기, +2주기, ... 확률
  drop_probability: 0.0
events:
  - {t: 1.0, action: set_command, vx: 0.4, yaw_rate: 0.0}
  - {t: 8.0, action: set_command, vx: 0.4, yaw_rate: 0.4}
