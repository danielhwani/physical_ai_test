# HMMWV 뒤따라 걷기 (MuJoCo 4족 + Chrono HMMWV/SCM, 문서 §5)
# HMMWV가 로봇 앞에서 +x로 먼저 달리며 바퀴 자국(폭 약 20 cm, 깊이 약 5 cm)을 남기고, 로봇이 그 뒤를 따라 걷는다.
# HMMWV 왼쪽 바퀴는 차체 중심선에서 +0.88 m. 중심선을 y=-0.75 m에 두어 왼쪽 바퀴 자국 중심이
# 로봇 왼발 경로(y=+0.14 m)에 오게 했다 -> 왼발은 자국 안, 오른발은 평지 (좌우 비대칭 지면).
# 로봇과 HMMWV 사이에 물리 작용은 없다 (단방향). 코드 변경 없이 시나리오만으로 구성.
name: hmmwv_follow
duration: 20.0
seed: 3
terrain:
  size: [10.0, 10.0]
  resolution: 0.05
  z_range: [-0.3, 0.4]
  patches: []            # SCM 영역은 평평해야 한다
controller:
  type: trot
  period: 0.36
  swing_height: 0.08
  stand_height: 0.27
  perception: null     # 지형 인지 (LiDAR 높이 지도 -> 디딜 곳, 발 높이). 켜기: --set controller.perception.sensor=front_lidar
events:
  - {t: 2.0, action: set_command, vx: 0.35, yaw_rate: 0.0}   # HMMWV가 1초 먼저 출발
chrono:
  sync_dt: 0.04
  terrain_dt: 0.2
  near_distance: 3.0
  vehicle:
    model: hmmwv
    start: [3.5, -0.75]  # 차체 기준점(앞뒤 바퀴 사이). 뒷바퀴가 로봇 앞 약 1.8 m
    end: [7.5, -0.75]    # 이 점을 지나면 제동 (앞바퀴가 지형 끝 10 m를 넘지 않게)
    speed: 1.5           # m/s
    t_start: 1.0
    yield_to_robot: true # 차 앞 진로(앞 9 m, 옆 ±1.8 m)에 로봇이 있으면 제동하고 기다린다 (로봇이 차 뒤에서 따라가 결과는 그대로)
  scm:
    center: [5.25, -0.75] # 지형 격자점 (0.05 m 배수)
    size: [9.5, 4.0]      # x 0.5~10, y -2.75~1.25: 출발부터 정지까지 바퀴가 지나는 영역
    resolution: 0.05
    soil:                # 단단한 흙: 자국 약 5.5 cm (vehicle_crossing.yaml 참고)
      bekker_kphi: 5.0e6
      bekker_kc: 0
      bekker_n: 1.1
      cohesion: 0
      friction_deg: 30
      janosi_shear: 0.01
      elastic_k: 4.0e7
      damping_r: 3.0e4
